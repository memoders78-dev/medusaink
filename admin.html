<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INK MEDUSA | Yönetim Paneli</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101010;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(1100px, 94%);
      margin: 40px auto;
    }

    h1 {
      letter-spacing: 3px;
    }

    .muted {
      color: #aaa;
    }

    .card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }

    input, button, select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      font: inherit;
    }

    input {
      display: block;
      width: 100%;
      margin: 12px 0;
      background: #101010;
      color: white;
    }

    button {
      cursor: pointer;
      background: #d4af37;
      color: #111;
      font-weight: bold;
      border: 0;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .secondary {
      background: #333;
      color: white;
    }

    .danger {
      background: #8b2929;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .filters select {
      background: #1b1b1b;
      color: white;
    }

    .appointment {
      background: #202020;
      border: 1px solid #353535;
      padding: 18px;
      border-radius: 12px;
      margin: 12px 0;
    }

    .appointment h3 {
      margin-top: 0;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #54471b;
      color: #ffdc68;
      font-size: 12px;
    }

    .confirmed {
      background: #173d2b;
      color: #82e6ad;
    }

    .cancelled {
      background: #512323;
      color: #ffaaaa;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    #message {
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    @media (min-width: 700px) {
      .login-card {
        max-width: 430px;
        margin: 80px auto;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="topbar">
      <div>
        <h1>INK MEDUSA</h1>
        <p class="muted">Randevu yönetim paneli</p>
      </div>
    </header>

    <section id="loginSection" class="card login-card">
      <h2>Yönetici Girişi</h2>
      <p class="muted">Yönetici hesabınla giriş yap.</p>

      <form id="loginForm">
        <input id="email" type="email" placeholder="E-posta adresi"
               autocomplete="username" required>

        <input id="password" type="password" placeholder="Şifre"
               autocomplete="current-password" required>

        <button type="submit">Giriş Yap</button>
      </form>

      <p id="loginMessage" role="status"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="card topbar">
        <div>
          <h2>Randevular</h2>
          <p id="userEmail" class="muted"></p>
        </div>

        <div class="actions">
          <button id="refreshButton" class="secondary">Yenile</button>
          <button id="logoutButton" class="secondary">Çıkış Yap</button>
        </div>
      </div>

      <div class="filters">
        <select id="statusFilter" aria-label="Duruma göre filtrele">
          <option value="pending">Bekleyenler</option>
          <option value="confirmed">Onaylananlar</option>
          <option value="cancelled">İptal edilenler</option>
          <option value="completed">Tamamlananlar</option>
          <option value="all">Tüm randevular</option>
        </select>
      </div>

      <p id="dashboardMessage" role="status"></p>
      <div id="appointments"></div>
    </section>
  </main>

  <script>
    // Supabase Project URL ve Publishable Key bilgilerini buraya ekle.
    const SUPABASE_URL = "https://nwgvnrdcscaosobzyeoi.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_A4XezYH8T4LY5HjtfIjyTA_dJ2Njbk8";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const $ = id => document.getElementById(id);

    function showMessage(id, text) {
      $(id).textContent = text;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function formatDate(value) {
      if (!value) return "-";

      const date = new Date(value + "T12:00:00");

      return Number.isNaN(date.getTime())
        ? value
        : date.toLocaleDateString("tr-TR", {
            day: "numeric",
            month: "long",
            year: "numeric"
          });
    }

    function statusLabel(status) {
      return ({
        pending: "Bekliyor",
        confirmed: "Onaylandı",
        cancelled: "İptal edildi",
        completed: "Tamamlandı"
      })[status] || status || "Bilinmiyor";
    }

    async function checkSession() {
      const { data, error } = await db.auth.getSession();

      if (error) {
        showMessage("loginMessage", error.message);
        return;
      }

      const session = data.session;

      $("loginSection").classList.toggle("hidden", !!session);
      $("dashboard").classList.toggle("hidden", !session);

      if (session) {
        $("userEmail").textContent = session.user.email || "";
        await loadAppointments();
      }
    }

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();

      showMessage("loginMessage", "Giriş yapılıyor...");

      const { error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });

      if (error) {
        showMessage("loginMessage", "Giriş başarısız: " + error.message);
        return;
      }

      $("password").value = "";
      showMessage("loginMessage", "");
      await checkSession();
    });

    $("logoutButton").addEventListener("click", async () => {
      await db.auth.signOut();
      $("appointments").replaceChildren();
      await checkSession();
    });

    $("refreshButton").addEventListener("click", loadAppointments);
    $("statusFilter").addEventListener("change", loadAppointments);

    async function loadAppointments() {
      const { data: sessionData } = await db.auth.getSession();

      if (!sessionData.session) {
        await checkSession();
        return;
      }

      const list = $("appointments");
      list.replaceChildren();

      showMessage("dashboardMessage", "Randevular yükleniyor...");

      let query = db
        .from("appointments")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(200);

      const status = $("statusFilter").value;

      if (status !== "all") {
        query = query.eq("status", status);
      }

      const { data, error } = await query;

      if (error) {
        showMessage(
          "dashboardMessage",
          "Randevular yüklenemedi. Veritabanı izinleri kontrol edilmeli. " +
          error.message
        );
        return;
      }

      if (!data || data.length === 0) {
        showMessage("dashboardMessage", "Bu filtrede randevu bulunamadı.");
        return;
      }

      showMessage("dashboardMessage", data.length + " randevu listelendi.");

      for (const appointment of data) {
        const item = document.createElement("article");
        item.className = "appointment";

        const badgeClass = appointment.status === "confirmed"
          ? "badge confirmed"
          : appointment.status === "cancelled"
          ? "badge cancelled"
          : "badge";

        item.innerHTML = `
          <h3>${escapeHTML(appointment.customer_name || "İsimsiz müşteri")}</h3>
          <span class="${badgeClass}">${escapeHTML(statusLabel(appointment.status))}</span>
          <p><strong>Telefon:</strong> ${escapeHTML(appointment.phone)}</p>
          <p><strong>Hizmet:</strong> ${escapeHTML(appointment.service)}</p>
          <p><strong>Sanatçı:</strong> ${escapeHTML(appointment.artist)}</p>
          <p><strong>Tarih:</strong> ${escapeHTML(formatDate(appointment.appointment_date))}</p>
          <p><strong>Saat:</strong> ${escapeHTML(appointment.appointment_time)}</p>
          <p><strong>Not:</strong> ${escapeHTML(appointment.note || "-")}</p>
          <div class="actions"></div>
        `;

        const actions = item.querySelector(".actions");

        if (appointment.status === "pending") {
          const confirmButton = document.createElement("button");
          confirmButton.textContent = "Onayla";
          confirmButton.addEventListener("click", () =>
            updateStatus(appointment, "confirmed")
          );
          actions.append(confirmButton);

          const cancelButton = document.createElement("button");
          cancelButton.textContent = "İptal Et";
          cancelButton.className = "danger";
          cancelButton.addEventListener("click", () =>
            updateStatus(appointment, "cancelled")
          );
          actions.append(cancelButton);
        }

        if (appointment.status === "confirmed") {
          const completeButton = document.createElement("button");
          completeButton.textContent = "Tamamlandı";
          completeButton.addEventListener("click", () =>
            updateStatus(appointment, "completed")
          );
          actions.append(completeButton);

          const cancelButton = document.createElement("button");
          cancelButton.textContent = "İptal Et";
          cancelButton.className = "danger";
          cancelButton.addEventListener("click", () =>
            updateStatus(appointment, "cancelled")
          );
          actions.append(cancelButton);
        }

        list.append(item);
      }
    }

    async function updateStatus(appointment, newStatus) {
      const labels = {
        confirmed: "onaylamak",
        cancelled: "iptal etmek",
        completed: "tamamlandı olarak işaretlemek"
      };

      if (!confirm(
        `${appointment.customer_name || "Bu randevuyu"} ` +
        `${labels[newStatus]} istiyor musun?`
      )) {
        return;
      }

      showMessage("dashboardMessage", "Randevu güncelleniyor...");

      /*
       * Güvenlik için bu işlem ancak Supabase RLS politikaları,
       * yalnızca yetkili yöneticiye UPDATE izni veriyorsa çalışmalıdır.
       */
      const { data, error } = await db
        .from("appointments")
        .update({ status: newStatus })
        .eq("id", appointment.id)
        .eq("status", appointment.status)
        .select("id");

      if (error) {
        showMessage(
          "dashboardMessage",
          "Güncelleme başarısız. Yönetici UPDATE izni/RLS kontrol edilmeli. " +
          error.message
        );
        return;
      }

      if (!data || data.length === 0) {
        showMessage(
          "dashboardMessage",
          "Randevu değişmedi. Yetkiyi veya mevcut durumu kontrol et."
        );
        return;
      }

      showMessage(
        "dashboardMessage",
        "Durum güncellendi. WhatsApp mesajı henüz bu işlemle gönderilmiyor."
      );

      await loadAppointments();
    }

    db.auth.onAuthStateChange(() => {
      setTimeout(checkSession, 0);
    });

    checkSession();
  </script>
</body>
</html>
